<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0c11">
<title>Seite nicht gefunden – Robin Langer</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem 1.25rem;background:#0d0c11;color:#f3eee6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
main{max-width:34rem;width:100%}
.code{margin:0;font-weight:800;font-size:clamp(5rem,28vw,9rem);line-height:.9;letter-spacing:-.04em;color:#f0b44c}
h1{margin:1rem 0 .4rem;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15}
p{margin:0 0 1.6rem;color:#a9a3b3}
.row{display:flex;flex-wrap:wrap;gap:.7rem}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1.4rem;border-radius:2rem;border:1px solid #2a2833;color:#f3eee6;text-decoration:none;font-weight:600}
a.main{background:#f0b44c;border-color:#f0b44c;color:#17141c}
a:hover,a:focus-visible{border-color:#f0b44c;outline:none}
a.main:hover,a.main:focus-visible{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<h1>Diese Seite gibt es nicht.</h1>
<p>Der Link ist vielleicht veraltet oder falsch geschrieben. <span lang="en">Page not found.</span></p>
<div class="row">
<a class="main" href="/">Zur Startseite</a>
<a href="/#anfrage">Anfrage stellen</a>
<a href="/galerie/">Kundengalerie</a>
</div>
</main>
</body>
</html>
